<script>
 
// ===== Antwoorden: kiezen of zelf schrijven =====

// "kiezen", "schrijven" of "afwisselend"
let antwoordModus = "kiezen";

// Telt een antwoord met één klein tikfoutje als goed?
// false = nee: Eefje ziet dan "Bijna!" en het telt als fout.
const BIJNA_TELT_ALS_GOED = false;

// Andere schrijfwijzen die ook goed zijn
const andereSchrijfwijzen = {
    "'s-Hertogenbosch": ["Den Bosch"],
    "Den Haag": ["'s-Gravenhage"],
    "Biesbosch": ["Biesbos"],
    "Friesland": ["Fryslân"],
    "Rijn": ["Boven-Rijn"]
};

function kiesModus(modus) {
    antwoordModus = modus;

    document.querySelectorAll(".modus-keuze button").forEach(knop => {
        knop.classList.toggle("actief", knop.dataset.modus === modus);
    });

    try {
        localStorage.setItem("antwoordModus", modus);
    } catch (e) {
        // geen opslag beschikbaar: niet erg
    }
}

function isSchrijfVraag() {
    if (antwoordModus === "schrijven") return true;
    if (antwoordModus === "afwisselend") return Math.random() < 0.5;
    return false;
}

// Hoofdletters, spaties, streepjes, accenten en "de/het" tellen niet mee
function normaliseer(tekst) {
    return tekst
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .replace(/^(de|het)\s+/, "")
        .replace(/[\s\-'’.]/g, "");
}

function afstand(a, b) {
    const rij = Array.from({ length: b.length + 1 }, (_, i) => i);

    for (let i = 1; i <= a.length; i++) {
        let vorige = rij[0];
        rij[0] = i;

        for (let j = 1; j <= b.length; j++) {
            const tijdelijk = rij[j];
            rij[j] = Math.min(
                rij[j] + 1,
                rij[j - 1] + 1,
                vorige + (a[i - 1] === b[j - 1] ? 0 : 1)
            );
            vorige = tijdelijk;
        }
    }

    return rij[b.length];
}

// Geeft "goed", "bijna" of "fout"
function beoordeelGeschreven(invoer, juist) {
    const getypt = normaliseer(invoer);
    const goedeVormen = [juist, ...(andereSchrijfwijzen[juist] || [])]
        .map(normaliseer);

    if (getypt === "") return "fout";
    if (goedeVormen.includes(getypt)) return "goed";

    const kleinsteAfstand = Math.min(
        ...goedeVormen.map(vorm => afstand(getypt, vorm))
    );

    // Eén foutje mag "bijna" heten, bij lange woorden twee
    const marge = juist.length >= 9 ? 2 : 1;

    return kleinsteAfstand <= marge ? "bijna" : "fout";
}

// Maakt een tekstvak met een knop "Controleer"
function maakSchrijfveld(container, juist, klaar) {
    container.innerHTML = "";

    const veld = document.createElement("input");
    veld.type = "text";
    veld.className = "schrijfveld";
    veld.placeholder = "Typ hier je antwoord";
    veld.autocomplete = "off";
    veld.autocapitalize = "words";
    veld.spellcheck = false;

    const knop = document.createElement("button");
    knop.type = "button";
    knop.textContent = "Controleer";

    function controleer() {
        if (veld.disabled) return;

        if (veld.value.trim() === "") {
            veld.focus();
            return;
        }

        const uitslag = beoordeelGeschreven(veld.value, juist);

        veld.disabled = true;
        knop.disabled = true;
        veld.classList.add(uitslag === "goed" ? "correct" : "incorrect");

        klaar(uitslag);
    }

    knop.addEventListener("click", controleer);
    veld.addEventListener("keydown", function (e) {
        if (e.key === "Enter") controleer();
    });

    container.appendChild(veld);
    container.appendChild(knop);

    veld.focus();
}

function feedbackTekst(uitslag, juist) {
    if (uitslag === "goed") {
        return "✅ Goed!";
    }

    if (uitslag === "bijna") {
        return BIJNA_TELT_ALS_GOED
            ? "✅ Goed! Let wel op de spelling: <strong>" + juist + "</strong>"
            : "✏️ Bijna! Let op de spelling: <strong>" + juist + "</strong>";
    }

    return "❌ Fout. Het juiste antwoord is: <strong>" + juist + "</strong>";
}

function teltAlsGoed(uitslag) {
    return uitslag === "goed" ||
        (uitslag === "bijna" && BIJNA_TELT_ALS_GOED);
}

// Na een fout iets langer de tijd om het goede antwoord te lezen
function wachttijd(uitslag) {
    return uitslag === "goed" ? 1800 : 3000;
}

let huidigeCategorie = null;

let fout = 0;
let volgendeVraagTimer = null;

function shuffle(array) {
    const kopie = [...array];

    for (let i = kopie.length - 1; i > 0; i--) {
        const willekeurigeIndex = Math.floor(Math.random() * (i + 1));
        [kopie[i], kopie[willekeurigeIndex]] =
            [kopie[willekeurigeIndex], kopie[i]];
    }

    return kopie;
}

function vuurwerk() {

    confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
    });

    setTimeout(() => {
        confetti({
            particleCount: 150,
            spread: 120,
            origin: { x: 0.2, y: 0.6 }
        });
    }, 250);

    setTimeout(() => {
        confetti({
            particleCount: 150,
            spread: 120,
            origin: { x: 0.8, y: 0.6 }
        });
    }, 500);
}
function startQuiz(type) {
    huidigeCategorie = quizzes[type];

    if (!huidigeCategorie) {
        console.error("Onbekende quizcategorie:", type);
        return;
    }

    if (volgendeVraagTimer) {
        clearTimeout(volgendeVraagTimer);
        volgendeVraagTimer = null;
    }

    huidigeVragen = shuffle(huidigeCategorie.vragen);
    vraagNummer = 0;
    goed = 0;
    fout = 0;

    document.getElementById("menu").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("titel").textContent =
        huidigeCategorie.titel;

    document.getElementById("correct").textContent = "0";
    document.getElementById("wrong").textContent = "0";
    document.getElementById("feedback").textContent = "";

    nieuweVraag();

function nieuweVraag() {
    if (!huidigeCategorie || huidigeVragen.length === 0) {
        return;
    }

    if (vraagNummer >= huidigeVragen.length) {
        toonEindscore();
        return;
    }

    huidigeVraag = huidigeVragen[vraagNummer];

    const vraagElement = document.getElementById("province");
    const antwoordenElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");

    feedbackElement.textContent = "";

    vraagElement.innerHTML =
        "<small style='display:block; color:#333; font-size:0.55em; " +
        "margin-bottom:10px;'>" +
        huidigeCategorie.instructie +
        "</small>" +
        huidigeVraag.vraag;

    if (isSchrijfVraag()) {
        maakSchrijfveld(
            antwoordenElement,
            huidigeVraag.antwoord,
            verwerkAntwoord
        );
        return;
    }

    const alleAntwoorden = [
        ...new Set(
            huidigeCategorie.vragen.map(item => item.antwoord)
        )
    ];

    let antwoorden = [huidigeVraag.antwoord];

    const alternatieven = shuffle(
        alleAntwoorden.filter(
            antwoord => antwoord !== huidigeVraag.antwoord
        )
    );

    const aantalAlternatieven = Math.min(3, alternatieven.length);

    antwoorden.push(
        ...alternatieven.slice(0, aantalAlternatieven)
    );

    antwoorden = shuffle(antwoorden);

    antwoordenElement.innerHTML = "";

    antwoorden.forEach(antwoord => {
        const knop = document.createElement("button");
        knop.type = "button";
        knop.textContent = antwoord;

        knop.addEventListener("click", function () {
            controleerAntwoord(antwoord, knop);
        });

        antwoordenElement.appendChild(knop);
    });
}

function controleerAntwoord(gekozenAntwoord, gekozenKnop) {
    const knoppen = document.querySelectorAll("#answers button");

    knoppen.forEach(knop => {
        knop.disabled = true;

        if (knop.textContent === huidigeVraag.antwoord) {
            knop.classList.add("correct");
        }
    });

    const isGoed = gekozenAntwoord === huidigeVraag.antwoord;
    gekozenKnop.classList.add(isGoed ? "correct" : "incorrect");

    verwerkAntwoord(isGoed ? "goed" : "fout");
}

function verwerkAntwoord(uitslag) {
    document.getElementById("feedback").innerHTML =
        feedbackTekst(uitslag, huidigeVraag.antwoord);

    if (teltAlsGoed(uitslag)) {
        goed++;
    } else {
        fout++;
    }

    document.getElementById("correct").textContent = goed;
    document.getElementById("wrong").textContent = fout;

    vraagNummer++;

    volgendeVraagTimer = setTimeout(function () {
        nieuweVraag();
    }, wachttijd(uitslag));
}

function toonEindscore() {
    const totaal = huidigeVragen.length;
    const percentage = Math.round((goed / totaal) * 100);

    let beoordeling;

    if (percentage === 100) {
beoordeling = "👑 Fantastisch Eefje! Alles goed!";
vuurwerk();
} else if (percentage >= 80) {
        beoordeling = "🥇 Heel goed gedaan Eefje!";
    } else if (percentage >= 60) {
        beoordeling = "🥈 Goed bezig!";
    } else {
        beoordeling = "📚 Nog een keer oefenen samen met papa of mama!";
    }

    document.getElementById("province").textContent = "Quiz afgerond";
    document.getElementById("answers").innerHTML =
        "<button type='button' onclick='herstartQuiz()'>" +
        "Opnieuw proberen" +
        "</button>";

    document.getElementById("feedback").innerHTML =
        beoordeling +
        "<br><br>Je had <strong>" +
        goed +
        " van de " +
        totaal +
        "</strong> vragen goed.";
}

function herstartQuiz() {
    huidigeVragen = shuffle(huidigeCategorie.vragen);
    vraagNummer = 0;
    goed = 0;
    fout = 0;

    document.getElementById("correct").textContent = "0";
    document.getElementById("wrong").textContent = "0";

}

function zetKaartVerhouding() {
    const kaart = document.getElementById("nederlandKaart");
    const naam = kaart.getAttribute("src");

    let verhouding = kaartVerhoudingen[naam];

    if (!verhouding && kaart.naturalWidth) {

// Inzoomen: zo vaak gebeurt het, en hoe ver
const ZOOM_KANS = 0.4;     // 40% van de vragen
const ZOOM_FACTOR = 2.2;   // 2,2 keer zo groot

// Zoomt de kaart in op punt (x, y) in procenten.
// zoom = 1 betekent: hele kaart.
function zetKaartZoom(x, y, zoom) {
    const kaart = document.getElementById("nederlandKaart");
    const markering = document.getElementById("kaartMarkering");
    const label = document.getElementById("zoomLabel");

    const venster = 100 / zoom;   // hoeveel % van de kaart zichtbaar is

    // Niet precies in het midden, anders verraadt het midden de plek
    const schuif = (Math.random() - 0.5) * venster * 0.4;
    const schuifY = (Math.random() - 0.5) * venster * 0.4;

    const begrens = (waarde) =>
        Math.min(Math.max(waarde, 0), 100 - venster);

    const links = zoom === 1 ? 0 : begrens(x - venster / 2 + schuif);
    const boven = zoom === 1 ? 0 : begrens(y - venster / 2 + schuifY);

    kaart.style.transform =
        "scale(" + zoom + ") translate(" + (-links) + "%, " + (-boven) + "%)";

    markering.style.left = (x - links) * zoom + "%";
    markering.style.top = (y - boven) * zoom + "%";

    label.style.display = zoom === 1 ? "none" : "block";
}

function maakKaartAntwoorden() {
    const antwoordenElement =
        document.getElementById("kaartAntwoorden");

            antwoordenElement,
            huidigeKaartVraag.antwoord,
            verwerkKaartAntwoord

        ...new Set(
            kaartVragen[
                huidigeKaartVraag.soort || kaartCategorie
            ].map(
                vraag => vraag.antwoord
            )
        )
    ];

    const fouteAntwoorden = shuffle(
        alleAntwoorden.filter(
            antwoord =>
                antwoord !== huidigeKaartVraag.antwoord
        )
    );

    let antwoorden = [
        huidigeKaartVraag.antwoord,
        ...fouteAntwoorden.slice(0, 3)

    antwoordenElement.innerHTML = "";

        knop.textContent = antwoord;

        knop.addEventListener("click", function () {
            controleerKaartAntwoord(antwoord, knop);

        antwoordenElement.appendChild(knop);
    });
}
