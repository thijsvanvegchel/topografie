<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topografie voor Eefje</title>

<style>

body {
font-family: 'Segoe UI', Arial, sans-serif;
max-width: 1000px;
margin: 0 auto;
padding: 40px;
text-align: center;
 
background: linear-gradient(
135deg,
#001f4d 0%,
#003d99 40%,
#0055cc 100%
);
 
min-height: 100vh;
}
 
.quiz-box {
background: rgba(255,255,255,0.96);
color: #003366;
 
padding: 40px;
border-radius: 24px;
box-shadow: 0 20px 40px rgba(0,0,0,0.25);
 
margin-top: 30px;
}

h1 {
color: #001f4d;
}

.province {
    font-size: 2em;
    margin: 20px 0;
    color: #ff6600;
}

button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 1.1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: linear-gradient(
    135deg,
    #ff6b00,
    #ff8c00
    );
    color: white;
    transition: all 0.25s ease;
}

button:hover {
    background: linear-gradient(
        135deg,
        #ff8c00,
        #ffb347
    );
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,107,0,0.4);
}

.correct {
    background-color: #28a745 !important;
}

.incorrect {
    background-color: #dc3545 !important;
}

#feedback {
    font-size: 1.3em;
    margin-top: 20px;
    font-weight: bold;
}

#score {
    margin-top: 20px;
    font-size: 1.2em;
}
#kaartContainer {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 25px auto;
    border-radius: 16px;
    overflow: hidden;
    background-color: white;
    box-shadow: 0 10px 25px rgba(0, 31, 77, 0.25);
}

#nederlandKaart {
    display: block;
    width: 100%;
    height: auto;
}

#kaartMarkering {
    position: absolute;
    width: 34px;
    height: 34px;
    transform: translate(-50%, -50%);
    border: 5px solid white;
    border-radius: 50%;
    background-color: #ff6b00;
    box-shadow:
        0 0 0 5px rgba(255, 107, 0, 0.4),
        0 4px 12px rgba(0, 0, 0, 0.5);
    animation: kaartPuls 1.2s infinite;
    pointer-events: none;
}

@keyframes kaartPuls {
    0% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.2);
    }

    100% {
        transform: translate(-50%, -50%) scale(1);
    }
}

#kaartAntwoorden {
    margin-top: 20px;
}

#kaartFeedback {
    min-height: 35px;
    margin: 20px 0;
    font-size: 1.25em;
    font-weight: bold;
}

#kaartScore {
    margin: 20px 0;
    font-size: 1.1em;
}

.secondary-button {
    background: linear-gradient(
        135deg,
        #334155,
        #475569
    );
}

.secondary-button:hover {
    background: linear-gradient(
        135deg,
        #475569,
        #64748b
    );
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .quiz-box {
        padding: 20px;
    }

    #kaartMarkering {
        width: 25px;
        height: 25px;
        border-width: 3px;
    }
}
</style>

</head>
<body>

<div id="menu" class="quiz-box">

    <h1>🇳🇱 Eefjes Topografie</h1>

    <p>Kies een onderdeel:</p>

    <button onclick="startQuiz('provincies')">
        Provincies & Hoofdsteden
    </button>

    <button onclick="startKaartQuiz()">
        Kaart van Nederland
    </button>

    <button onclick="startQuiz('steden')">
        Grote Steden
    </button>

    <button onclick="startQuiz('vliegvelden')">
        Vliegvelden
    </button>

    <button onclick="startQuiz('rivieren')">
        Grote Rivieren
    </button>

</div>

<div id="quiz" class="quiz-box" style="display:none;">

    <h1 id="titel"></h1>

    <p>Wat hoort bij:</p>

    <div id="province" class="province"></div>

    <div id="answers"></div>

    <div id="feedback"></div>

    <div id="score">
        Goed: <span id="correct">0</span> |
        Fout: <span id="wrong">0</span>
    </div>

    <br>

    <button onclick="terugNaarMenu()">
        Terug naar menu
    </button>

</div>
<div id="kaartQuiz" class="quiz-box" style="display:none;">

    <h1>🗺️ Kaart van Nederland</h1>

    <p id="kaartInstructie">
        Welke provincie wordt aangegeven?
    </p>

    <div id="kaartContainer">
        <img
            src="kaart-nederland.jpeg"
            id="nederlandKaart"
            alt="Topografische kaart van Nederland"
        >

        <div id="kaartMarkering"></div>
    </div>

    <div id="kaartAntwoorden"></div>

    <div id="kaartFeedback"></div>

    <div id="kaartScore">
        Vraag: <span id="kaartVoortgang">1</span> |
        Goed: <span id="kaartGoed">0</span> |
        Fout: <span id="kaartFout">0</span>
    </div>

    <button
        id="wisselKaartVragen"
        class="secondary-button"
        onclick="wisselKaartCategorie()"
    >
        Nu steden oefenen
    </button>

    <button
        class="secondary-button"
        onclick="terugNaarMenuVanKaart()">
        Terug naar menu
    </button>

</div>
<script>
 
const quizzes = {
    provincies: {
        titel: "Provincies & Hoofdsteden",
        instructie: "Wat is de hoofdstad van:",
        vragen: [
            { vraag: "Groningen", antwoord: "Groningen" },
            { vraag: "Friesland", antwoord: "Leeuwarden" },
            { vraag: "Drenthe", antwoord: "Assen" },
            { vraag: "Overijssel", antwoord: "Zwolle" },
            { vraag: "Flevoland", antwoord: "Lelystad" },
            { vraag: "Gelderland", antwoord: "Arnhem" },
            { vraag: "Utrecht", antwoord: "Utrecht" },
            { vraag: "Noord-Holland", antwoord: "Haarlem" },
            { vraag: "Zuid-Holland", antwoord: "Den Haag" },
            { vraag: "Zeeland", antwoord: "Middelburg" },
            { vraag: "Noord-Brabant", antwoord: "'s-Hertogenbosch" },
            { vraag: "Limburg", antwoord: "Maastricht" }
        ]
    },

    steden: {
        titel: "Grote Steden",
        instructie: "In welke provincie ligt:",
        vragen: [
            { vraag: "Amsterdam", antwoord: "Noord-Holland" },
            { vraag: "Rotterdam", antwoord: "Zuid-Holland" },
            { vraag: "Den Haag", antwoord: "Zuid-Holland" },
            { vraag: "Utrecht", antwoord: "Utrecht" },
            { vraag: "Eindhoven", antwoord: "Noord-Brabant" },
            { vraag: "Tilburg", antwoord: "Noord-Brabant" },
            { vraag: "Groningen", antwoord: "Groningen" },
            { vraag: "Almere", antwoord: "Flevoland" },
            { vraag: "Breda", antwoord: "Noord-Brabant" },
            { vraag: "Nijmegen", antwoord: "Gelderland" },
            { vraag: "Apeldoorn", antwoord: "Gelderland" },
            { vraag: "Haarlem", antwoord: "Noord-Holland" },
            { vraag: "Arnhem", antwoord: "Gelderland" },
            { vraag: "Enschede", antwoord: "Overijssel" },
            { vraag: "Amersfoort", antwoord: "Utrecht" },
            { vraag: "Zwolle", antwoord: "Overijssel" },
            { vraag: "Leeuwarden", antwoord: "Friesland" },
            { vraag: "Maastricht", antwoord: "Limburg" }
        ]
    },

    vliegvelden: {
        titel: "Vliegvelden",
        instructie: "Bij welke plaats ligt:",
        vragen: [
            { vraag: "Schiphol", antwoord: "Amsterdam" },
            { vraag: "Rotterdam The Hague Airport", antwoord: "Rotterdam" },
            { vraag: "Eindhoven Airport", antwoord: "Eindhoven" },
            { vraag: "Maastricht Aachen Airport", antwoord: "Maastricht" },
            { vraag: "Groningen Airport Eelde", antwoord: "Groningen" }
        ]
    },

    rivieren: {
        titel: "Grote Rivieren",
        instructie: "Door welke stad stroomt deze rivier?",
        vragen: [
            { vraag: "De Maas", antwoord: "Maastricht" },
            { vraag: "De Waal", antwoord: "Nijmegen" },
            { vraag: "De Nederrijn", antwoord: "Arnhem" },
            { vraag: "De IJssel", antwoord: "Deventer" },
            { vraag: "De Lek", antwoord: "Vianen" }
        ]
    }
};

let huidigeCategorie = null;
let huidigeVragen = [];
let huidigeVraag = null;
let vraagNummer = 0;
let goed = 0;
let fout = 0;
let volgendeVraagTimer = null;

function shuffle(array) {
    const kopie = [...array];

    for (let i = kopie.length - 1; i > 0; i--) {
        const willekeurigeIndex = Math.floor(Math.random() * (i + 1));
        [kopie[i], kopie[willekeurigeIndex]] =
            [kopie[willekeurigeIndex], kopie[i]];
    }

    return kopie;
}

function startQuiz(type) {
    huidigeCategorie = quizzes[type];

    if (!huidigeCategorie) {
        console.error("Onbekende quizcategorie:", type);
        return;
    }

    if (volgendeVraagTimer) {
        clearTimeout(volgendeVraagTimer);
        volgendeVraagTimer = null;
    }

    huidigeVragen = shuffle(huidigeCategorie.vragen);
    vraagNummer = 0;
    goed = 0;
    fout = 0;

    document.getElementById("menu").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("titel").textContent =
        huidigeCategorie.titel;

    document.getElementById("correct").textContent = "0";
    document.getElementById("wrong").textContent = "0";
    document.getElementById("feedback").textContent = "";

    nieuweVraag();
}

function nieuweVraag() {
    if (!huidigeCategorie || huidigeVragen.length === 0) {
        return;
    }

    if (vraagNummer >= huidigeVragen.length) {
        toonEindscore();
        return;
    }

    huidigeVraag = huidigeVragen[vraagNummer];

    const vraagElement = document.getElementById("province");
    const antwoordenElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");

    feedbackElement.textContent = "";

    vraagElement.innerHTML =
        "<small style='display:block; color:#333; font-size:0.55em; " +
        "margin-bottom:10px;'>" +
        huidigeCategorie.instructie +
        "</small>" +
        huidigeVraag.vraag;

    const alleAntwoorden = [
        ...new Set(
            huidigeCategorie.vragen.map(item => item.antwoord)
        )
    ];

    let antwoorden = [huidigeVraag.antwoord];

    const alternatieven = shuffle(
        alleAntwoorden.filter(
            antwoord => antwoord !== huidigeVraag.antwoord
        )
    );

    const aantalAlternatieven = Math.min(3, alternatieven.length);

    antwoorden.push(
        ...alternatieven.slice(0, aantalAlternatieven)
    );

    antwoorden = shuffle(antwoorden);

    antwoordenElement.innerHTML = "";

    antwoorden.forEach(antwoord => {
        const knop = document.createElement("button");
        knop.type = "button";
        knop.textContent = antwoord;

        knop.addEventListener("click", function () {
            controleerAntwoord(antwoord, knop);
        });

        antwoordenElement.appendChild(knop);
    });
}

function controleerAntwoord(gekozenAntwoord, gekozenKnop) {
    const knoppen = document.querySelectorAll("#answers button");

    knoppen.forEach(knop => {
        knop.disabled = true;

        if (knop.textContent === huidigeVraag.antwoord) {
            knop.classList.add("correct");
        }
    });

    if (gekozenAntwoord === huidigeVraag.antwoord) {
        gekozenKnop.classList.add("correct");
        document.getElementById("feedback").textContent = "✅ Goed!";
        goed++;
    } else {
        gekozenKnop.classList.add("incorrect");

        document.getElementById("feedback").innerHTML =
            "❌ Fout. Het juiste antwoord is: <strong>" +
            huidigeVraag.antwoord +
            "</strong>";

        fout++;
    }

    document.getElementById("correct").textContent = goed;
    document.getElementById("wrong").textContent = fout;

    vraagNummer++;

    volgendeVraagTimer = setTimeout(function () {
        nieuweVraag();
    }, 1800);
}

function toonEindscore() {
    const totaal = huidigeVragen.length;
    const percentage = Math.round((goed / totaal) * 100);

    let beoordeling;

    if (percentage === 100) {
        beoordeling = "🏆 Perfect! Alles goed!";
    } else if (percentage >= 80) {
        beoordeling = "🥇 Heel goed gedaan!";
    } else if (percentage >= 60) {
        beoordeling = "🥈 Goed bezig!";
    } else {
        beoordeling = "📚 Nog een keer oefenen!";
    }

    document.getElementById("province").textContent = "Quiz afgerond";
    document.getElementById("answers").innerHTML =
        "<button type='button' onclick='herstartQuiz()'>" +
        "Opnieuw proberen" +
        "</button>";

    document.getElementById("feedback").innerHTML =
        beoordeling +
        "<br><br>Je had <strong>" +
        goed +
        " van de " +
        totaal +
        "</strong> vragen goed.";
}

function herstartQuiz() {
    huidigeVragen = shuffle(huidigeCategorie.vragen);
    vraagNummer = 0;
    goed = 0;
    fout = 0;

    document.getElementById("correct").textContent = "0";
    document.getElementById("wrong").textContent = "0";
    document.getElementById("feedback").textContent = "";

    nieuweVraag();
}

function terugNaarMenu() {
    if (volgendeVraagTimer) {
        clearTimeout(volgendeVraagTimer);
        volgendeVraagTimer = null;
    }

    document.getElementById("quiz").style.display = "none";
    document.getElementById("menu").style.display = "block";

    document.getElementById("answers").innerHTML = "";
    document.getElementById("feedback").textContent = "";

    huidigeCategorie = null;
    huidigeVragen = [];
    huidigeVraag = null;
    vraagNummer = 0;
    goed = 0;
    fout = 0;
}
 const kaartVragen = {
    provincies: [
        { antwoord: "Friesland", x: 60, y: 21 },
        { antwoord: "Groningen", x: 83, y: 16 },
        { antwoord: "Drenthe", x: 79, y: 29 },
        { antwoord: "Overijssel", x: 76, y: 43 },
        { antwoord: "Flevoland", x: 58, y: 39 },
        { antwoord: "Gelderland", x: 65, y: 54 },
        { antwoord: "Utrecht", x: 48, y: 56 },
        { antwoord: "Noord-Holland", x: 38, y: 37 },
        { antwoord: "Zuid-Holland", x: 31, y: 56 },
        { antwoord: "Zeeland", x: 17, y: 76 },
        { antwoord: "Noord-Brabant", x: 48, y: 72 },
        { antwoord: "Limburg", x: 65, y: 82 }
    ],

    steden: [
        { antwoord: "Amsterdam", x: 40, y: 46 },
        { antwoord: "Leeuwarden", x: 61, y: 16 },
        { antwoord: "Groningen", x: 78, y: 15 },
        { antwoord: "Assen", x: 79, y: 23 },
        { antwoord: "Zwolle", x: 68, y: 41 },
        { antwoord: "Utrecht", x: 53, y: 42 },
        { antwoord: "Arnhem", x: 64, y: 58 },
        { antwoord: "'s-Hertogenbosch", x: 50, y: 68 },
        { antwoord: "Den Haag", x: 27, y: 56 },
        { antwoord: "Rotterdam", x: 31, y: 61 },
        { antwoord: "Middelburg", x: 11, y: 76 },
        { antwoord: "Eindhoven", x: 54, y: 79 },
        { antwoord: "Maastricht", x: 61, y: 95 }
    ]
};

let kaartCategorie = "provincies";
let actieveKaartVragen = [];
let huidigeKaartVraag = null;
let kaartVraagNummer = 0;
let kaartGoed = 0;
let kaartFout = 0;
let kaartTimer = null;

function startKaartQuiz() {
    if (kaartTimer) {
        clearTimeout(kaartTimer);
    }

    document.getElementById("menu").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("kaartQuiz").style.display = "block";

    kaartCategorie = "provincies";
    kaartVraagNummer = 0;
    kaartGoed = 0;
    kaartFout = 0;
    document.getElementById("kaartMarkering").style.display = "block";
    document.getElementById("kaartFeedback").textContent = "";
    document.getElementById("kaartAntwoorden").innerHTML = "";

    actieveKaartVragen = shuffle(
        kaartVragen[kaartCategorie]
    );

    document.getElementById("kaartGoed").textContent = "0";
    document.getElementById("kaartFout").textContent = "0";

    werkKaartTekstenBij();
    nieuweKaartVraag();
}

function wisselKaartCategorie() {
    if (kaartTimer) {
        clearTimeout(kaartTimer);
    }

    if (kaartCategorie === "provincies") {
        kaartCategorie = "steden";
    } else {
        kaartCategorie = "provincies";
    }

    kaartVraagNummer = 0;
    kaartGoed = 0;
    kaartFout = 0;

    actieveKaartVragen = shuffle(
        kaartVragen[kaartCategorie]
    );

    document.getElementById("kaartGoed").textContent = "0";
    document.getElementById("kaartFout").textContent = "0";
    document.getElementById("kaartFeedback").textContent = "";

    werkKaartTekstenBij();
    nieuweKaartVraag();
}

function werkKaartTekstenBij() {
    const instructie =
        document.getElementById("kaartInstructie");

    const wisselknop =
        document.getElementById("wisselKaartVragen");

    if (kaartCategorie === "provincies") {
        instructie.textContent =
            "Welke provincie wordt aangegeven?";

        wisselknop.textContent =
            "Nu steden oefenen";
    } else {
        instructie.textContent =
            "Welke stad wordt aangegeven?";

        wisselknop.textContent =
            "Nu provincies oefenen";
    }
}

function nieuweKaartVraag() {
    if (kaartVraagNummer >= actieveKaartVragen.length) {
        toonKaartEindscore();
        return;
    }

    huidigeKaartVraag =
        actieveKaartVragen[kaartVraagNummer];

    document.getElementById("kaartFeedback").textContent = "";

    document.getElementById("kaartVoortgang").textContent =
        (kaartVraagNummer + 1) +
        " van " +
        actieveKaartVragen.length;

    const markering =
        document.getElementById("kaartMarkering");

    markering.style.left = huidigeKaartVraag.x + "%";
    markering.style.top = huidigeKaartVraag.y + "%";

    maakKaartAntwoorden();
}

function maakKaartAntwoorden() {
    const antwoordenElement =
        document.getElementById("kaartAntwoorden");

    const alleAntwoorden = [
        ...new Set(
            kaartVragen[kaartCategorie].map(
                vraag => vraag.antwoord
            )
        )
    ];

    const fouteAntwoorden = shuffle(
        alleAntwoorden.filter(
            antwoord =>
                antwoord !== huidigeKaartVraag.antwoord
        )
    );

    let antwoorden = [
        huidigeKaartVraag.antwoord,
        ...fouteAntwoorden.slice(0, 3)
    ];

    antwoorden = shuffle(antwoorden);
    antwoordenElement.innerHTML = "";

    antwoorden.forEach(antwoord => {
        const knop = document.createElement("button");

        knop.type = "button";
        knop.textContent = antwoord;

        knop.addEventListener("click", function () {
            controleerKaartAntwoord(antwoord, knop);
        });

        antwoordenElement.appendChild(knop);
    });
}

function controleerKaartAntwoord(antwoord, gekozenKnop) {
    const knoppen =
        document.querySelectorAll("#kaartAntwoorden button");

    knoppen.forEach(knop => {
        knop.disabled = true;

        if (knop.textContent === huidigeKaartVraag.antwoord) {
            knop.classList.add("correct");
        }
    });

    if (antwoord === huidigeKaartVraag.antwoord) {
        gekozenKnop.classList.add("correct");

        document.getElementById("kaartFeedback").textContent =
            "✅ Goed!";

        kaartGoed++;
    } else {
        gekozenKnop.classList.add("incorrect");

        document.getElementById("kaartFeedback").innerHTML =
            "❌ Fout. Het juiste antwoord is: <strong>" +
            huidigeKaartVraag.antwoord +
            "</strong>";

        kaartFout++;
    }

    document.getElementById("kaartGoed").textContent =
        kaartGoed;

    document.getElementById("kaartFout").textContent =
        kaartFout;

    kaartVraagNummer++;

    kaartTimer = setTimeout(function () {
        nieuweKaartVraag();
    }, 1800);
}

function toonKaartEindscore() {
    document.getElementById("kaartMarkering").style.display =
        "none";

    document.getElementById("kaartAntwoorden").innerHTML =
        "<button type='button' onclick='herstartKaartQuiz()'>" +
        "Opnieuw oefenen" +
        "</button>";

    document.getElementById("kaartFeedback").innerHTML =
        "🏆 Ronde afgerond!<br><br>" +
        "Je had <strong>" +
        kaartGoed +
        " van de " +
        actieveKaartVragen.length +
        "</strong> vragen goed.";
}

function herstartKaartQuiz() {
    kaartVraagNummer = 0;
    kaartGoed = 0;
    kaartFout = 0;

    actieveKaartVragen = shuffle(
        kaartVragen[kaartCategorie]
    );

    document.getElementById("kaartMarkering").style.display =
        "block";

    document.getElementById("kaartGoed").textContent = "0";
    document.getElementById("kaartFout").textContent = "0";
    document.getElementById("kaartFeedback").textContent = "";

    nieuweKaartVraag();
}

function terugNaarMenuVanKaart() {
    if (kaartTimer) {
        clearTimeout(kaartTimer);
        kaartTimer = null;
    }

    document.getElementById("kaartQuiz").style.display =
        "none";

    document.getElementById("menu").style.display =
        "block";

    document.getElementById("kaartMarkering").style.display =
        "block";
document.getElementById("kaartFeedback").textContent = "";
document.getElementById("kaartAntwoorden").innerHTML = "";
    
}
</script>
</body>
</html>
