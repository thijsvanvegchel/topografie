<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topografie voor Eefje</title>

<style>

body {
font-family: 'Segoe UI', Arial, sans-serif;
max-width: 1000px;
margin: 0 auto;
padding: 40px;
text-align: center;
 
background: linear-gradient(
135deg,
#001f4d 0%,
#003d99 40%,
#0055cc 100%
);
 
min-height: 100vh;
}
 
.quiz-box {
background: rgba(255,255,255,0.96);
color: #003366;
 
padding: 40px;
border-radius: 24px;
box-shadow: 0 20px 40px rgba(0,0,0,0.25);
 
margin-top: 30px;
}

h1 {
color: #001f4d;
}

.province {
    font-size: 2em;
    margin: 20px 0;
    color: #ff6600;
}

button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 1.1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: linear-gradient(
    135deg,
    #ff6b00,
    #ff8c00
    );
    color: white;
    transition: all 0.25s ease;
}

button:hover {
    background: linear-gradient(
        135deg,
        #ff8c00,
        #ffb347
    );
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,107,0,0.4);
}

.correct {
    background-color: #28a745 !important;
}

.incorrect {
    background-color: #dc3545 !important;
}

#feedback {
    font-size: 1.3em;
    margin-top: 20px;
    font-weight: bold;
}

#score {
    margin-top: 20px;
    font-size: 1.2em;
}
#kaartContainer {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 25px auto;
    border-radius: 16px;
    overflow: hidden;
    background-color: white;
    box-shadow: 0 10px 25px rgba(0, 31, 77, 0.25);
}

#nederlandKaart {
    display: block;
    width: 100%;
    height: auto;
    transform-origin: 0 0;
    transition: transform 0.7s ease;
}

#zoomLabel {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(0, 31, 77, 0.8);
    color: white;
    font-size: 0.9em;
    display: none;
    pointer-events: none;
}

#kaartMarkering {
    position: absolute;
    width: 34px;
    height: 34px;
    transform: translate(-50%, -50%);
    border: 5px solid white;
    border-radius: 50%;
    background-color: #ff6b00;
    box-shadow:
        0 0 0 5px rgba(255, 107, 0, 0.4),
        0 4px 12px rgba(0, 0, 0, 0.5);
    animation: kaartPuls 1.2s infinite;
    transition: left 0.7s ease, top 0.7s ease;
    pointer-events: none;
}

@keyframes kaartPuls {
    0% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.2);
    }

    100% {
        transform: translate(-50%, -50%) scale(1);
    }
}

#kaartAntwoorden {
    margin-top: 20px;
}

#kaartFeedback {
    min-height: 35px;
    margin: 20px 0;
    font-size: 1.25em;
    font-weight: bold;
}

#kaartScore {
    margin: 20px 0;
    font-size: 1.1em;
}

.secondary-button {
    background: linear-gradient(
        135deg,
        #334155,
        #475569
    );
}

.secondary-button:hover {
    background: linear-gradient(
        135deg,
        #475569,
        #64748b
    );
}

.modus-keuze {
    display: flex;
    gap: 8px;
    margin: 10px 0 25px;
}

.modus-keuze button {
    margin: 0;
    padding: 12px 8px;
    font-size: 1em;
    background: #e2e8f0;
    color: #334155;
}

.modus-keuze button:hover {
    background: #cbd5e1;
    box-shadow: none;
}

.modus-keuze button.actief {
    background: linear-gradient(135deg, #001f4d, #0055cc);
    color: white;
}

.schrijfveld {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin: 10px 0;
    padding: 15px;
    font-size: 1.3em;
    text-align: center;
    border: 3px solid #cbd5e1;
    border-radius: 8px;
    color: #001f4d;
    outline: none;
}

.schrijfveld:focus {
    border-color: #ff8c00;
}

.schrijfveld.correct {
    border-color: #28a745;
    background: #e9f7ec !important;
}

.schrijfveld.incorrect {
    border-color: #dc3545;
    background: #fdecee !important;
}

.menu-kop {
    color: #001f4d;
    margin: 35px 0 10px;
    padding-top: 25px;
    border-top: 2px solid #e2e8f0;
    font-size: 1.3em;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .quiz-box {
        padding: 20px;
    }

    #kaartMarkering {
        width: 25px;
        height: 25px;
        border-width: 3px;
    }
}

/* ===== Passend op telefoon en tablet ===== */

* {
    box-sizing: border-box;
}

body {
    padding: 20px;
    min-height: 100vh;
    min-height: 100dvh;
}

.quiz-box {
    margin-top: 0;
    padding: 28px;
}

h1 {
    margin: 0 0 10px;
    font-size: 1.8em;
}

/* De kaart is nooit hoger dan ongeveer de helft van het scherm.
   --ratio (breedte / hoogte van de kaart) wordt door de code gezet. */
#kaartContainer {
    width: min(100%, 560px, calc(55vh * var(--ratio, 0.9)));
    width: min(100%, 560px, calc(55dvh * var(--ratio, 0.9)));
    margin: 12px auto;
    border-radius: 14px;
}

#kaartInstructie {
    margin: 0 0 6px;
    font-weight: 600;
}

/* Meerkeuze: twee knoppen naast elkaar */
#answers,
#kaartAntwoorden {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

#answers button,
#kaartAntwoorden button {
    margin: 0;
    padding: 14px 8px;
    min-height: 52px;
    font-size: 1.05em;
    line-height: 1.2;
}

/* Schrijfvak, Controleer en Opnieuw: over de hele breedte */
#answers .schrijfveld,
#kaartAntwoorden .schrijfveld,
#answers .schrijfveld + button,
#kaartAntwoorden .schrijfveld + button,
#answers button:only-child,
#kaartAntwoorden button:only-child {
    grid-column: 1 / -1;
    margin: 0;
}

.schrijfveld {
    font-size: 1.25em;
    padding: 12px;
}

#feedback,
#kaartFeedback {
    min-height: 1.6em;
    margin: 12px 0;
    font-size: 1.15em;
}

#score,
#kaartScore {
    margin: 10px 0;
    font-size: 1em;
    color: #475569;
}

.province {
    font-size: 1.8em;
    margin: 12px 0;
}

/* Telefoon */
@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    .quiz-box {
        padding: 14px;
        border-radius: 18px;
    }

    h1 {
        font-size: 1.35em;
    }

    #menu h1 {
        font-size: 1.6em;
    }

    #kaartContainer {
        width: min(100%, calc(50vh * var(--ratio, 0.9)));
        width: min(100%, calc(50dvh * var(--ratio, 0.9)));
        margin: 8px auto;
    }

    #kaartMarkering {
        width: 22px;
        height: 22px;
        border-width: 3px;
    }

    #answers button,
    #kaartAntwoorden button {
        font-size: 0.95em;
        padding: 10px 6px;
        min-height: 46px;
    }

    .menu-kop {
        margin-top: 20px;
        padding-top: 15px;
    }

    #menu > button {
        padding: 12px;
        margin: 8px 0;
    }

    .modus-keuze button {
        font-size: 0.85em;
        padding: 10px 4px;
    }

    .province {
        font-size: 1.5em;
    }

    button {
        padding: 12px;
        margin: 8px 0;
    }
}

/* Tablet of laptop liggend: kaart links, vragen rechts */
@media (min-width: 800px) and (orientation: landscape) {
    body {
        max-width: 1200px;
    }

    #kaartQuiz {
        grid-template-columns: auto minmax(280px, 1fr);
        grid-template-rows: auto auto auto auto auto auto 1fr;
        column-gap: 30px;
        align-items: start;
        text-align: center;
    }

    /* De code zet display:block; liggend maken we er een raster van */
    #kaartQuiz[style*="block"] {
        display: grid !important;
    }

    #kaartQuiz > h1 {
        grid-column: 1 / -1;
    }

    #kaartContainer {
        grid-column: 1;
        grid-row: 2 / span 6;
        width: min(60vw, calc((100vh - 160px) * var(--ratio, 0.9)));
        width: min(60vw, calc((100dvh - 160px) * var(--ratio, 0.9)));
        margin: 0;
    }

    #kaartQuiz > :not(h1):not(#kaartContainer) {
        grid-column: 2;
    }

    #kaartInstructie {
        margin-top: 10px;
    }

    #kaartAntwoorden {
        grid-template-columns: 1fr;
    }

    #kaartQuiz > button {
        margin: 6px 0;
    }
}

#menu {
    position: relative;
}

.geluid-knop {

    top: 12px;

.prestatie {

.leeg {

.sterren-totaal {

.legenda {

}

.tip {
    margin: 10px auto 0;
    max-width: 520px;
    padding: 10px 14px;
    background: #fff8e1;
    border: 2px solid #ffd54f;
    border-radius: 12px;
    color: #5d4300;
    font-size: 0.85em;
    font-weight: normal;

    line-height: 1.4;
}

.verder-knop {

}

.reeks-melding {

#answers .volle-breedte,

@media (max-width: 600px) {

    }

        font-size: 1.8em;
    }
}

/* ===== Compact menu met tegels ===== */

    margin-bottom: 4px;
}

.menu-label {
    margin: 10px 0 6px;
    font-size: 0.95em;
}

#menu .modus-keuze {

}

#menu .modus-keuze button {
    padding: 8px 6px;
    font-size: 0.95em;
}

.menu-raster {

    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));

.menu-raster.drie {

.tegel-icoon {

.tegel-breed .tegel-icoon {

}

#menu .prestatie {

}

.tegel-breed .prestatie {
    margin-left: 4px;
}

.menu-kop {
    margin: 18px 0 8px;
    padding-top: 14px;
    font-size: 1.15em;
}

.sterren-totaal {
    margin: 0;
    font-size: 0.95em;
}

.legenda {
    margin: 2px 0 4px;
    font-size: 0.75em;

@media (max-width: 600px) {

<script>
 
// ===== Antwoorden: kiezen of zelf schrijven =====

// "kiezen", "schrijven" of "afwisselend"
let antwoordModus = "kiezen";

// Telt een antwoord met één klein tikfoutje als goed?
// false = nee: Eefje ziet dan "Bijna!" en het telt als fout.
const BIJNA_TELT_ALS_GOED = false;

// Andere schrijfwijzen die ook goed zijn
const andereSchrijfwijzen = {
    "'s-Hertogenbosch": ["Den Bosch"],
    "Den Haag": ["'s-Gravenhage"],
    "Biesbosch": ["Biesbos"],
    "Friesland": ["Fryslân"],
    "Rijn": ["Boven-Rijn"]
};

function kiesModus(modus) {
    antwoordModus = modus;

    document.querySelectorAll(".modus-keuze button").forEach(knop => {
        knop.classList.toggle("actief", knop.dataset.modus === modus);
    });

    try {
        localStorage.setItem("antwoordModus", modus);
    } catch (e) {
        // geen opslag beschikbaar: niet erg
    }
}

function isSchrijfVraag() {
    if (antwoordModus === "schrijven") return true;
    if (antwoordModus === "afwisselend") return Math.random() < 0.5;
    return false;
}

// Hoofdletters, spaties, streepjes, accenten en "de/het" tellen niet mee
function normaliseer(tekst) {
    return tekst
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .replace(/^(de|het)\s+/, "")
        .replace(/[\s\-'’.]/g, "");
}

function afstand(a, b) {
    const rij = Array.from({ length: b.length + 1 }, (_, i) => i);

    for (let i = 1; i <= a.length; i++) {
        let vorige = rij[0];
        rij[0] = i;

        for (let j = 1; j <= b.length; j++) {
            const tijdelijk = rij[j];
            rij[j] = Math.min(
                rij[j] + 1,
                rij[j - 1] + 1,
                vorige + (a[i - 1] === b[j - 1] ? 0 : 1)
            );
            vorige = tijdelijk;
        }
    }

    return rij[b.length];
}

// Geeft "goed", "bijna" of "fout"
function beoordeelGeschreven(invoer, juist) {
    const getypt = normaliseer(invoer);
    const goedeVormen = [juist, ...(andereSchrijfwijzen[juist] || [])]
        .map(normaliseer);

    if (getypt === "") return "fout";
    if (goedeVormen.includes(getypt)) return "goed";

    const kleinsteAfstand = Math.min(
        ...goedeVormen.map(vorm => afstand(getypt, vorm))
    );

    // Eén foutje mag "bijna" heten, bij lange woorden twee
    const marge = juist.length >= 9 ? 2 : 1;

    return kleinsteAfstand <= marge ? "bijna" : "fout";
}

// Maakt een tekstvak met een knop "Controleer"
function maakSchrijfveld(container, juist, klaar) {
    container.innerHTML = "";

    const veld = document.createElement("input");
    veld.type = "text";
    veld.className = "schrijfveld";
    veld.placeholder = "Typ hier je antwoord";
    veld.autocomplete = "off";
    veld.autocapitalize = "words";
    veld.spellcheck = false;

    const knop = document.createElement("button");
    knop.type = "button";
    knop.textContent = "Controleer";

    function controleer() {
        if (veld.disabled) return;

        if (veld.value.trim() === "") {
            veld.focus();
            return;
        }

        const uitslag = beoordeelGeschreven(veld.value, juist);

        veld.disabled = true;
        knop.disabled = true;
        veld.classList.add(uitslag === "goed" ? "correct" : "incorrect");

        klaar(uitslag);
    }

    knop.addEventListener("click", controleer);
    veld.addEventListener("keydown", function (e) {
        if (e.key === "Enter") controleer();
    });

    container.appendChild(veld);
    container.appendChild(knop);

    veld.focus();
}

function feedbackTekst(uitslag, juist) {
    if (uitslag === "goed") {
        return "✅ Goed!";
    }

    if (uitslag === "bijna") {
        return BIJNA_TELT_ALS_GOED
            ? "✅ Goed! Let wel op de spelling: <strong>" + juist + "</strong>"
            : "✏️ Bijna! Let op de spelling: <strong>" + juist + "</strong>";
    }

    return "❌ Fout. Het juiste antwoord is: <strong>" + juist + "</strong>";
}

function teltAlsGoed(uitslag) {
    return uitslag === "goed" ||
        (uitslag === "bijna" && BIJNA_TELT_ALS_GOED);
}

// Na een fout iets langer de tijd om het goede antwoord te lezen
function wachttijd(uitslag) {
    return uitslag === "goed" ? 1800 : 3000;
}

// ===== Geluidjes =====

let geluidAan = true;
let audioContext = null;

function speelGeluid(soort) {
    if (!geluidAan) return;

    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }
    } catch (e) {
        return;
    }

    const nu = audioContext.currentTime;

    function toon(frequentie, start, duur, vorm = "sine", volume = 0.15) {
        const oscillator = audioContext.createOscillator();
        const versterker = audioContext.createGain();

        oscillator.type = vorm;
        oscillator.frequency.value = frequentie;

        versterker.gain.setValueAtTime(0.0001, nu + start);
        versterker.gain.exponentialRampToValueAtTime(volume, nu + start + 0.02);
        versterker.gain.exponentialRampToValueAtTime(0.0001, nu + start + duur);

        oscillator.connect(versterker);
        versterker.connect(audioContext.destination);

        oscillator.start(nu + start);
        oscillator.stop(nu + start + duur + 0.05);
    }

    if (soort === "goed") {
        toon(784, 0, 0.15);
        toon(1047, 0.1, 0.3);
    } else if (soort === "reeks") {
        [523, 659, 784, 1047].forEach((f, i) => toon(f, i * 0.09, 0.3));
    } else if (soort === "fout") {
        toon(220, 0, 0.3, "triangle", 0.12);
        toon(185, 0.15, 0.4, "triangle", 0.12);
    } else if (soort === "klaar") {
        [523, 659, 784, 1047, 784, 1047].forEach(
            (f, i) => toon(f, i * 0.13, 0.35, "triangle", 0.15)
        );
    }
}

function wisselGeluid() {
    geluidAan = !geluidAan;
    werkGeluidKnopBij();

    try {
        localStorage.setItem("geluidAan", geluidAan ? "ja" : "nee");
    } catch (e) {
        // geen opslag beschikbaar
    }

    if (geluidAan) speelGeluid("goed");
}

function werkGeluidKnopBij() {
    document.getElementById("geluidKnop").innerHTML = geluidAan
        ? "🔊<span class='geluid-tekst'> Geluid aan</span>"
        : "🔇<span class='geluid-tekst'> Geluid uit</span>";
}

// ===== Reeks: zoveel goed op rij =====

let reeks = 0;
const REEKS_MIJLPALEN = [3, 5, 10, 15, 20, 25, 30];

// Werkt de reeks bij, speelt een geluidje en geeft een melding terug
function werkReeksBij(isGoed) {
    reeks = isGoed ? reeks + 1 : 0;

    const mijlpaal = isGoed && (
        REEKS_MIJLPALEN.includes(reeks) ||
        (reeks > 30 && reeks % 10 === 0)
    );

    speelGeluid(isGoed ? (mijlpaal ? "reeks" : "goed") : "fout");

    if (mijlpaal && reeks >= 10 && typeof confetti === "function") {
        confetti({ particleCount: 70, spread: 70, origin: { y: 0.7 } });
    }

    toonReeks();

    return mijlpaal
        ? "<div class='reeks-melding'>🔥 " + reeks + " goed op rij!</div>"
        : "";
}

function toonReeks() {
    document.querySelectorAll(".reeks-teller").forEach(element => {
        element.textContent = reeks >= 2 ? " | 🔥 " + reeks : "";
    });
}

function resetReeks() {
    reeks = 0;
    toonReeks();
}

// ===== Feedback na een antwoord =====
// Goed: na even wachten vanzelf verder.
// Fout of bijna: tip laten zien en wachten op de knop "Verder".
function toonAntwoordFeedback(element, uitslag, juist, tip, reeksMelding, volgende) {
    let html = feedbackTekst(uitslag, juist) + reeksMelding;

    if (teltAlsGoed(uitslag)) {
        element.innerHTML = html;
        return setTimeout(volgende, reeksMelding ? 2200 : 1500);
    }

    if (tip) {
        html += "<div class='tip'>💡 " + tip + "</div>";
    }

    element.innerHTML = html;

    const knop = document.createElement("button");
    knop.type = "button";
    knop.className = "verder-knop";
    knop.textContent = "Verder ➜";
    knop.disabled = true;

    knop.addEventListener("click", function () {
        knop.disabled = true;
        volgende();
    });

    element.appendChild(knop);

    // Even wachten, zodat dezelfde Enter-toets niet meteen doorklikt
    setTimeout(function () {
        knop.disabled = false;
        knop.focus({ preventScroll: true });
        knop.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }, 600);

    return null;
}

const VOORTGANG_SLEUTEL = "topografieVoortgang";
const MEDAILLES = ["", "🥉", "🥈", "🥇"];
const MEDAILLE_NAMEN = ["", "bronzen", "zilveren", "gouden"];

function leesVoortgang() {

function bewaarVoortgang(voortgang) {

// 100% = 3 sterren, 80% = 2, 50% = 1
function sterrenVoor(percentage) {
    if (percentage === 100) return 3;
    if (percentage >= 80) return 2;
    if (percentage >= 50) return 1;
    return 0;
}

// Medaille hangt af van hoe ze antwoordde
function medailleVoorModus() {
    return { kiezen: 1, afwisselend: 2, schrijven: 3 }[antwoordModus] || 1;
}

function sterrenHtml(aantal) {
    return "⭐".repeat(aantal) +
        "<span class='leeg'>" + "⭐".repeat(3 - aantal) + "</span>";
}

function registreerResultaat(onderdeel, aantalGoed, totaal) {
    const percentage = Math.round((aantalGoed / totaal) * 100);
    const sterren = sterrenVoor(percentage);
    const medaille = sterren === 3 ? medailleVoorModus() : 0;

    const voortgang = leesVoortgang();
    const oud = voortgang[onderdeel] || { sterren: 0, medaille: 0 };

    voortgang[onderdeel] = {
        sterren: Math.max(oud.sterren || 0, sterren),
        medaille: Math.max(oud.medaille || 0, medaille)
    };

    bewaarVoortgang(voortgang);
    werkMenuBij();

    return {
        sterren,
        medaille,
        nieuweMedaille: medaille > (oud.medaille || 0)
    };
}

function resultaatHtml(resultaat) {
    let html = "<div class='sterren-groot'>" + sterrenHtml(resultaat.sterren) + "</div>";

    if (resultaat.medaille) {
        html += "<div class='medaille-melding'>" +
            MEDAILLES[resultaat.medaille] + " " +
            (resultaat.nieuweMedaille ? "Nieuw! Je hebt een " : "Weer een ") +
            MEDAILLE_NAMEN[resultaat.medaille] + " medaille" +
            (resultaat.nieuweMedaille ? " verdiend!" : "!") +
            "</div>";
    }

    if (resultaat.sterren < 3) {
        html += "<div class='hint'>Haal alles goed voor 3 sterren en een medaille!</div>";
    } else if (resultaat.medaille === 1) {
        html += "<div class='hint'>Probeer nu 🔀 Afwisselend voor zilver, of ✏️ Zelf schrijven voor goud!</div>";
    } else if (resultaat.medaille === 2) {
        html += "<div class='hint'>Probeer nu ✏️ Zelf schrijven voor goud!</div>";
    }

    return html;
}

function werkMenuBij() {
    const voortgang = leesVoortgang();

    document.querySelectorAll("#menu [data-onderdeel]").forEach(knop => {
        const delen = knop.dataset.onderdeel.split(",");

        const sterren = Math.min(...delen.map(d => (voortgang[d] || {}).sterren || 0));
        const medaille = Math.min(...delen.map(d => (voortgang[d] || {}).medaille || 0));

        let plek = knop.querySelector(".prestatie");

        if (!plek) {
            plek = document.createElement("span");
            plek.className = "prestatie";
            knop.appendChild(plek);
        }

        plek.innerHTML = sterrenHtml(sterren) + (medaille ? " " + MEDAILLES[medaille] : "");
    });

    let totaal = 0;
    Object.values(voortgang).forEach(o => { totaal += o.sterren || 0; });

    document.getElementById("sterrenTotaal").innerHTML = totaal
        ? "Je hebt al <strong>" + totaal + " ⭐</strong> verzameld!"
        : "Verdien sterren en medailles! ⭐";
}

function shuffle(array) {
    const kopie = [...array];

    for (let i = kopie.length - 1; i > 0; i--) {
        const willekeurigeIndex = Math.floor(Math.random() * (i + 1));
        [kopie[i], kopie[willekeurigeIndex]] =
            [kopie[willekeurigeIndex], kopie[i]];
    }

    return kopie;
}

function startQuiz(type) {
    huidigeCategorie = quizzes[type];

    if (!huidigeCategorie) {
        console.error("Onbekende quizcategorie:", type);
        return;
    }

    if (volgendeVraagTimer) {
        clearTimeout(volgendeVraagTimer);
        volgendeVraagTimer = null;
    }

    huidigType = type;
    huidigeVragen = shuffle(huidigeCategorie.vragen);
    vraagNummer = 0;

    fout = 0;

    document.getElementById("correct").textContent = "0";
    document.getElementById("wrong").textContent = "0";

    nieuweVraag();
}

function nieuweVraag() {
    if (!huidigeCategorie || huidigeVragen.length === 0) {
        return;
    }

    if (vraagNummer >= huidigeVragen.length) {
        toonEindscore();
        return;
    }

    huidigeVraag = huidigeVragen[vraagNummer];

    const vraagElement = document.getElementById("province");
    const antwoordenElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");

    feedbackElement.textContent = "";

    vraagElement.innerHTML =
        "<small style='display:block; color:#333; font-size:0.55em; " +
        "margin-bottom:10px;'>" +
        huidigeCategorie.instructie +
        "</small>" +
        huidigeVraag.vraag;

    if (isSchrijfVraag()) {
        maakSchrijfveld(
            antwoordenElement,
            huidigeVraag.antwoord,
            verwerkAntwoord
        );
        return;
    }

    const alleAntwoorden = [
        ...new Set(
            huidigeCategorie.vragen.map(item => item.antwoord)
        )
    ];

    let antwoorden = [huidigeVraag.antwoord];

    const alternatieven = shuffle(
        alleAntwoorden.filter(
            antwoord => antwoord !== huidigeVraag.antwoord
        )
    );

    const aantalAlternatieven = Math.min(3, alternatieven.length);

    antwoorden.push(
        ...alternatieven.slice(0, aantalAlternatieven)
    );

    antwoorden = shuffle(antwoorden);

    antwoordenElement.innerHTML = "";

    antwoorden.forEach(antwoord => {
        const knop = document.createElement("button");
        knop.type = "button";
        knop.textContent = antwoord;

        knop.addEventListener("click", function () {
            controleerAntwoord(antwoord, knop);

}

function toonEindscore() {
    const totaal = huidigeVragen.length;
    const vraagElement = document.getElementById("province");
    const antwoordenElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");

    // Einde van een foutjes-ronde
    if (isHerhaalRonde) {
        if (fouteVragen.length === 0) {
            vraagElement.textContent = "🎉 Alle foutjes verbeterd!";
            feedbackElement.innerHTML = "Super Eefje! Nu ken je ze allemaal.";
            vuurwerk();
            speelGeluid("klaar");
        } else {
            vraagElement.textContent = "Bijna!";
            feedbackElement.innerHTML =
                "Nog <strong>" + fouteVragen.length + "</strong> " +
                (fouteVragen.length === 1 ? "foutje" : "foutjes") +
                " over. Nog één rondje?";
        }

        antwoordenElement.innerHTML = eindKnoppen(
            fouteVragen.length, "startHerhaalRonde", "herstartQuiz", "Hele quiz opnieuw"
        );
        return;
    }

    const percentage = Math.round((goed / totaal) * 100);
    const resultaat = registreerResultaat("tekst-" + huidigType, goed, totaal);

    let beoordeling;

    if (percentage === 100) {
        beoordeling = "👑 Fantastisch Eefje! Alles goed!";
        vuurwerk();
    } else if (percentage >= 80) {
        beoordeling = "🌟 Heel goed gedaan Eefje!";
    } else if (percentage >= 60) {
        beoordeling = "👍 Goed bezig!";
    } else {
        beoordeling = "📚 Nog een keer oefenen samen met papa of mama!";
    }

    if (percentage >= 80) speelGeluid("klaar");

    vraagElement.textContent = "Quiz afgerond";

    antwoordenElement.innerHTML = eindKnoppen(
        fouteVragen.length, "startHerhaalRonde", "herstartQuiz", "Opnieuw proberen"
    );

    feedbackElement.innerHTML =
        beoordeling +
        "<br>Je had <strong>" + goed + " van de " + totaal +
        "</strong> vragen goed." +
        resultaatHtml(resultaat);
}

// Inzoomen: zo vaak gebeurt het, en hoe ver
const ZOOM_KANS = 0.4;     // 40% van de vragen
const ZOOM_FACTOR = 2.2;   // 2,2 keer zo groot

// Zoomt de kaart in op punt (x, y) in procenten.
// zoom = 1 betekent: hele kaart.
function zetKaartZoom(x, y, zoom) {
    const kaart = document.getElementById("nederlandKaart");
    const markering = document.getElementById("kaartMarkering");
    const label = document.getElementById("zoomLabel");

    const venster = 100 / zoom;   // hoeveel % van de kaart zichtbaar is

    // Niet precies in het midden, anders verraadt het midden de plek
    const schuif = (Math.random() - 0.5) * venster * 0.4;
    const schuifY = (Math.random() - 0.5) * venster * 0.4;

    const begrens = (waarde) =>
        Math.min(Math.max(waarde, 0), 100 - venster);

    const links = zoom === 1 ? 0 : begrens(x - venster / 2 + schuif);
    const boven = zoom === 1 ? 0 : begrens(y - venster / 2 + schuifY);

    kaart.style.transform =
        "scale(" + zoom + ") translate(" + (-links) + "%, " + (-boven) + "%)";

    markering.style.left = (x - links) * zoom + "%";
    markering.style.top = (y - boven) * zoom + "%";

    label.style.display = zoom === 1 ? "none" : "block";
}

        document.getElementById("kaartFeedback"),
        uitslag,
        huidigeKaartVraag.antwoord,
        tip,
        reeksMelding,
        nieuweKaartVraag
    );
}

function toonKaartEindscore() {
    const totaal = actieveKaartVragen.length;
    const antwoordenElement = document.getElementById("kaartAntwoorden");
    const feedbackElement = document.getElementById("kaartFeedback");

    zetKaartZoom(50, 50, 1);
    document.getElementById("kaartMarkering").style.display = "none";

    // Einde van een foutjes-ronde
    if (kaartHerhaalRonde) {
        if (kaartFouteVragen.length === 0) {
            feedbackElement.innerHTML =
                "🎉 Alle foutjes verbeterd!<br>Super Eefje! Nu ken je ze allemaal.";
            vuurwerk();
            speelGeluid("klaar");
        } else {
            feedbackElement.innerHTML =
                "Bijna! Nog <strong>" + kaartFouteVragen.length + "</strong> " +
                (kaartFouteVragen.length === 1 ? "foutje" : "foutjes") +
                " over. Nog één rondje?";
        }

        antwoordenElement.innerHTML = eindKnoppen(
            kaartFouteVragen.length, "startKaartHerhaalRonde", "herstartKaartQuiz", "Alles opnieuw oefenen"
        );
        return;
    }

    const percentage = Math.round((kaartGoed / totaal) * 100);
    const resultaat = registreerResultaat("kaart-" + kaartCategorie, kaartGoed, totaal);

    if (percentage >= 90) {
        vuurwerk();
    }

    if (percentage >= 80) speelGeluid("klaar");

    let beoordeling = "";

    if (percentage === 100) {
        beoordeling = "👑 Fantastisch Eefje! Alles goed!";
    } else if (percentage >= 90) {
        beoordeling = "🌟 Super gedaan!";
    } else if (percentage >= 75) {
        beoordeling = "👍 Heel goed!";
    } else {
        beoordeling = "🗺️ Goed geoefend!";
    }

    antwoordenElement.innerHTML = eindKnoppen(
        kaartFouteVragen.length, "startKaartHerhaalRonde", "herstartKaartQuiz", "Opnieuw oefenen"
    );

    feedbackElement.innerHTML =
        beoordeling +
        "<br>Je had <strong>" + kaartGoed + " van de " + totaal +
        "</strong> vragen goed." +
        resultaatHtml(resultaat);
}

// Alleen de plekken die fout gingen nog een keer
function startKaartHerhaalRonde() {
    actieveKaartVragen = shuffle(kaartFouteVragen);
    kaartFouteVragen = [];
    kaartHerhaalRonde = true;
    kaartVraagNummer = 0;
    kaartGoed = 0;
    kaartFout = 0;

    document.getElementById("kaartMarkering").style.display = "block";
    document.getElementById("kaartGoed").textContent = "0";
    document.getElementById("kaartFout").textContent = "0";
    document.getElementById("kaartFeedback").textContent = "";

    werkKaartTekstenBij();
    nieuweKaartVraag();
}

function herstartKaartQuiz() {
    kaartVraagNummer = 0;
    kaartGoed = 0;
    kaartFout = 0;
    kaartFouteVragen = [];
    kaartHerhaalRonde = false;
    resetReeks();

    actieveKaartVragen = shuffle(
        kaartVragen[kaartCategorie]
    );

    document.getElementById("kaartMarkering").style.display =
        "block";

    document.getElementById("kaartGoed").textContent = "0";
    document.getElementById("kaartFout").textContent = "0";
    document.getElementById("kaartFeedback").textContent = "";

    werkKaartTekstenBij();
    nieuweKaartVraag();
}

function terugNaarMenuVanKaart() {
    if (kaartTimer) {
        clearTimeout(kaartTimer);
        kaartTimer = null;
    }

    document.getElementById("kaartQuiz").style.display =
        "none";

    zetKaartZoom(50, 50, 1);

    document.getElementById("menu").style.display =
        "block";

    document.getElementById("kaartMarkering").style.display =
        "block";
document.getElementById("kaartFeedback").textContent = "";
document.getElementById("kaartAntwoorden").innerHTML = "";
    
}
